name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (created as tag v<version>)
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build app bundle
        env:
          PI_VERSION: ${{ steps.version.outputs.version }}
          PI_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          test -x "build/Pi Desktop.app/Contents/MacOS/PiDesktop"
          codesign --verify --deep --strict "build/Pi Desktop.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/Pi Desktop.app/Contents/Info.plist"
          lipo -archs "build/Pi Desktop.app/Contents/MacOS/PiDesktop"

      - name: Package zip and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="Pi-Desktop-${VERSION}-${ARCH}"
          ditto -c -k --keepParent "build/Pi Desktop.app" "${name}.zip"
          shasum -a 256 "${name}.zip" > "${name}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            Pi-Desktop-*.zip
            Pi-Desktop-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          ls -l dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
